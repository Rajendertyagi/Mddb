{{define "page_slug"}}{{.Page.Slug}}{{end}}
<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head_meta" .}}
    <meta name="description" content="{{.Page.Excerpt}}">
    <meta property="og:title" content="{{.Page.Title}} — MDDB Documentation">
    <meta property="og:description" content="{{.Page.Excerpt}}">
    <meta property="og:url" content="https://{{.Domain}}/{{.Page.Slug}}/" />
    <meta property="twitter:title" content="{{.Page.Title}} — MDDB Documentation">
    <meta property="twitter:url" content="https://{{.Domain}}/{{.Page.Slug}}/" />
    <link rel="canonical" href="https://{{.Domain}}/{{.Page.Slug}}/" />
    <title>{{.Page.Title}} — MDDB Documentation</title>
</head>
<body>
{{template "gtm_noscript" .}}
{{template "navbar" .}}

<div class="site-layout">
    {{template "sidebar" .}}
    <main id="main-content" class="main-content">
        <article class="doc-article">
            <header class="doc-header">
                <h1 class="doc-title">{{.Page.Title}}</h1>
            </header>
            <div class="doc-body">
                {{.Page.Content | safeHTML}}
            </div>
        </article>
    </main>
</div>

{{template "footer" .}}
<!-- htmlmin:ignore -->
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.esm.min.mjs';
mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

// Move fenced ```mermaid code blocks into <div class="mermaid"> for rendering.
// The docs site is built with HTML minification OFF (see deploy-docs.yml), so
// the diagram source keeps its (whitespace-significant) newlines verbatim — no
// fragile reconstruction is needed or wanted (it would corrupt valid diagrams).
document.querySelectorAll('pre code.language-mermaid').forEach(function(el) {
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = el.textContent;
    (el.closest('pre') || el.parentElement).replaceWith(div);
});
mermaid.run();
</script>
<!-- /htmlmin:ignore -->
</body>
</html>
