{{define "index_community"}}
<!-- Community Section -->
<section id="community" class="community">
    <div class="container">
        <h2>Community & Support <a href="#community" class="anchor-link"
                aria-label="Link to Community section">#</a></h2>
        <div class="community-grid">
            <a href="https://github.com/tradik/mddb" class="community-card" target="_blank" rel="noopener">
                <div class="community-icon">🐙</div>
                <h3>GitHub</h3>
                <p>Source code, issues, and discussions</p>
            </a>
            <a href="https://github.com/tradik/mddb/issues" class="community-card" target="_blank"
                rel="noopener">
                <div class="community-icon">🐛</div>
                <h3>Report Issues</h3>
                <p>Bug reports and feature requests</p>
            </a>
            <a href="https://github.com/tradik/mddb/discussions" class="community-card" target="_blank"
                rel="noopener">
                <div class="community-icon">💬</div>
                <h3>Discussions</h3>
                <p>Ask questions and share ideas</p>
            </a>
            <a href="https://github.com/tradik/mddb/blob/main/CONTRIBUTING.md" class="community-card"
                target="_blank" rel="noopener">
                <div class="community-icon">🤝</div>
                <h3>Contributing</h3>
                <p>Help improve MDDB</p>
            </a>
        </div>
    </div>
</section>
