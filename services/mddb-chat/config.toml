[server]
host = "0.0.0.0"
port = 11030
cors_origins = ["*"]

[mddb]
grpc_addr = "http://mddbd:11024"
default_collection = "docs"
search_top_k = 3
search_type = "hybrid"
auth_username = "admin"
auth_password = "admin123"

# LLM provider configuration
# Supported providers:
#   "openai"    — OpenAI (api.openai.com/v1)
#   "anthropic" — Claude (api.anthropic.com/v1)
#   Any OpenAI-compatible service also works with provider = "openai":
#     - Ollama:      api_url = "http://host.docker.internal:11434/v1"
#     - Bielik:      api_url = "https://api.bielik.ai/v1"
#     - Groq:        api_url = "https://api.groq.com/openai/v1"
#     - Mistral:     api_url = "https://api.mistral.ai/v1"
#     - OpenRouter:  api_url = "https://openrouter.ai/api/v1"
#     - Together:    api_url = "https://api.together.xyz/v1"
#     - DeepSeek:    api_url = "https://api.deepseek.com/v1"

[llm]
provider = "openai"
api_url = "http://host.docker.internal:11434/v1"
api_key = ""
model = "qwen3:8b"
max_tokens = 1024
temperature = 0.7
stream = true

[session]
max_concurrent = 2
queue_size = 10
max_history_length = 50
session_ttl_minutes = 1440
max_response_length = 4096
name_max_chars = 50

[security]
rate_limit_per_minute = 30
max_message_length = 2000

[scenarios.assistant]
name = "Documentation Assistant"
system_prompt = """You are a helpful documentation assistant for MDDB.
Answer questions based on the provided context from the documentation.
Be concise, accurate, and helpful. If you don't know the answer,
say so honestly rather than making something up."""
allowed_collections = ["docs"]
