name: Build Windows

# OPS-009: least privilege ??? builds publish nothing.
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/mddbd/**'
      - 'services/mddb-cli/**'
      - 'clients/go/mddb/**'
      - 'go.work'
      - 'Mddb-patches/**'
      - '.github/workflows/build-windows.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_VERSION: '1.26.5'
  # Disable Go workspace mode so each module builds independently.
  GOWORK: "off"

jobs:
  build-windows:
    name: Cross-compile Windows exes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply vendor patches
        run: git apply Mddb-patches/patches/*.patch

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/mddbd/go.sum

      - name: Build server (mddbd.exe)
        working-directory: services/mddbd
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o mddbd.exe .

      - name: Build client (mddb-cli.exe)
        working-directory: services/mddb-cli
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o mddb-cli.exe .

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp services/mddbd/mddbd.exe dist/
          cp services/mddb-cli/mddb-cli.exe dist/
          cp README.md dist/ || true
          cp LICENSE dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mddb-windows-amd64
          path: dist/

  windows-runtime:
    # Windows host runs go test natively (not cross-compiled) to catch
    # runtime gaps the cross-compile alone cannot: overwrite-rename, temp paths.
    name: Runtime tests on Windows
    runs-on: windows-latest
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Apply vendor patches
        run: git apply Mddb-patches/patches/*.patch

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/mddbd/go.sum

      - name: Test server (mddbd)
        working-directory: services/mddbd
        run: go test ./...

      - name: Build client (mddb-cli)
        working-directory: services/mddb-cli
        run: go build ./...
