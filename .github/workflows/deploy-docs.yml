name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'blog/**'
      - 'services/ssg-template/**'
      - 'scripts/check-docs-links.py'
      - '.ssg.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: "docs"
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.80.0'
  CLOUDFLARE_PROJECT: mddb-docs

jobs:
  deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # FE-002 / FE-007: gate the deploy on the SSG-template security regression
      # tests (XSS sanitization, ?doc validation, CDN SRI pins). A regression
      # here must block publishing the docs site, not ship silently.
      - name: Test SSG templates
        run: node --test services/ssg-template/*.test.mjs

      - name: Prepare metadata
        run: echo '{"categories":[],"media":[],"users":[]}' > docs/metadata.json

      - name: Generate site with SSG
        uses: spagu/ssg@1.8.13
        with:
          source: '.'
          template: 'ssg-template'
          domain: 'mddb.tradik.com'
          content-dir: 'docs'
          templates-dir: 'services'
          output-dir: 'dist'
          webp: 'true'
          webp-quality: '80'
          # Minification collapses whitespace inside Mermaid code blocks, which
          # breaks diagram parsing (xychart "y-axis 0 --> 55", subgraph layouts,
          # etc.). Mermaid source is whitespace-significant, so keep it verbatim.
          minify: 'false'
          clean: 'true'

      - name: Copy static files to dist
        run: |
          mkdir -p dist/docs/api
          cp services/ssg-template/swagger.html dist/docs/api/swagger.html
          cp services/ssg-template/404.html dist/404.html
          cp docs/openapi.yaml dist/docs/api/openapi.yaml
          # og:image is referenced as https://mddb.tradik.com/og-image.png by
          # every page's meta tags. It must stay a PNG at the site root: the
          # SSG's webp pass rewrites anything under images/, and several social
          # crawlers still refuse WebP previews.
          cp services/ssg-template/og-image.png dist/og-image.png
          # The SSG writes the sitemap before the theme emits robots/canonical,
          # so it cannot know which pages exclude themselves. Prune after.
          python3 scripts/prune-sitemap.py dist

      # SEO-001: a link that 404s on mddb.tradik.com must block the deploy, not
      # surface weeks later in a crawl report. Offline check — external hosts
      # are never fetched.
      - name: Check for broken internal links
        run: python3 scripts/check-docs-links.py dist

      - name: Create Cloudflare Pages project (if not exists)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@${{ env.WRANGLER_VERSION }} pages project create ${{ env.CLOUDFLARE_PROJECT }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT }} --commit-dirty=true
