## Bug List

### Critical Issues
$(if [ "$critical_count" -gt 0 ]; then echo "No critical issues found."; else echo "None"; fi)

### High Issues
1. **Non-Atomic File Replace**
   - **Severity**: High
   - **Status**: Known limitation
   - **Description**: Remove-then-rename creates race window
   - **Fix**: Implement \`MoveFileEx\` with \`MOVEFILE_REPLACE_EXISTING\`

2. **Audit Key Collision (Fixed)**
   - **Severity**: High
   - **Status**: ✓ Patched (0008)
   - **Description**: Coarse Windows clock caused key collisions
   - **Fix**: One \`NextSequence()\` per event

### Medium Issues
1. **gRPC Restore Error Handling**
   - **Severity**: Medium
   - **Status**: Known limitation
   - **Description**: If reopen fails, server has no database
   - **Fix**: Implement rollback to original DB handle

