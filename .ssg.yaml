# SSG configuration for MDDB documentation site
# Dev:  ssg --config .ssg.yaml
# Prod: ssg --config .ssg.yaml --clean --minify-all

source: .
content_dir: docs
pages_path: .

# Blog posts live outside docs/ and are merged in as posts (slug prefix
# "blog/" → URLs /blog/<name>/; the /blog/ index is docs/BLOG.md with
# layout: blog).
content_sources:
  - path: blog
    type: post
    category: Blog
template: ssg-template
templates_dir: services
domain: mddb.tradik.com
output_dir: dist
port: 8888
post_url_format: slug
page_format: directory
http: false
watch: false

# Build optimization
webp: true
# minify_all collapses whitespace inside Mermaid code blocks, which corrupts
# diagrams (Mermaid source is whitespace-significant: xychart "y-axis 0 --> 55",
# subgraph layouts, sequence diagrams). Keep HTML un-minified so diagram source
# survives verbatim. Cloudflare Pages still serves it gzip/brotli-compressed.
minify_all: false
clean: true

# Native mermaid rendering: ```mermaid fences become <pre class="mermaid">
# and the runtime is injected only on pages/posts that contain a diagram.
# (Replaces the theme's former page.html-only bootstrap script, which never
# ran for posts — blog diagrams stayed as plain code blocks.)
mermaid: true
mermaid_theme: neutral
mermaid_background: "#ffffff"


# Enable sitemap and robots.txt generation
sitemap_off: false
robots_off: false

# Rewrite .md links to final /docs/ URLs
rewrite_md_links: true
# Drop the ".md" from link text that is a bare filename
# ([TEMPORAL-TRACK.md](...) renders as "TEMPORAL-TRACK")
strip_md_link_text: true

# Template engine (Go templates)
engine: "go"
