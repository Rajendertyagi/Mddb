[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mddb-client"
version = "2.9.17"
description = "Python gRPC client for MDDB (Markdown Database)."
readme = "example.py"
license = { text = "BSD-3-Clause" }
authors = [{ name = "tradik" }]
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.62",
    "protobuf>=4.25",
]

[project.urls]
Homepage = "https://github.com/tradik/mddb"
Repository = "https://github.com/tradik/mddb"

[tool.setuptools]
packages = ["mddb_client"]
