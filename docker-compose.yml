# Reusable anchors (OPS-002): log rotation (max 10 MB × 3) + resource
# limits/reservations applied to every service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-deploy-server: &deploy-server
  resources:
    limits:
      cpus: "2.00"
      memory: 2G
    reservations:
      cpus: "0.50"
      memory: 512M

x-deploy-medium: &deploy-medium
  resources:
    limits:
      cpus: "1.00"
      memory: 512M
    reservations:
      cpus: "0.25"
      memory: 128M

x-deploy-small: &deploy-small
  resources:
    limits:
      cpus: "0.50"
      memory: 256M
    reservations:
      cpus: "0.10"
      memory: 64M

services:
  mddb:
    image: tradik/mddb:latest
    container_name: mddb-server
    restart: unless-stopped
    ports:
      - "11023:11023" # HTTP API
      - "11024:11024" # gRPC API
      - "9000:9000" # MCP
      - "11443:11443" # HTTP/3 (extreme mode)
    volumes:
      - mddb-data:/data
      - ./backups:/backups
    environment:
      - MDDB_PATH=/data/mddb.db
      - MDDB_MODE=wr
      - MDDB_EXTREME=true
      - MDDB_HTTP_PORT=11023
      - MDDB_GRPC_PORT=11024
      - MDDB_HTTP3_PORT=11443
      # - MDDB_PANEL_MODE=external  # internal (default, CORS enabled) or external (CORS disabled, panel proxies)
      - TZ=UTC
    networks:
      - mddb-network
    logging: *default-logging
    deploy: *deploy-server
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11023/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.mddb.description=MDDB - High-Performance Markdown Database"
      - "com.mddb.version=${MDDB_VERSION:-2.10.0}"
      - "com.mddb.performance=optimized"

  mddb-panel:
    build:
      context: .
      dockerfile: services/mddb-panel/Dockerfile
    container_name: mddb-panel
    restart: unless-stopped
    ports:
      - "3000:3000" # Web UI
    environment:
      - MDDB_SERVER=http://mddb:11023
    networks:
      - mddb-network
    logging: *default-logging
    deploy: *deploy-small
    depends_on:
      mddb:
        condition: service_healthy
    labels:
      - "com.mddb.description=MDDB Panel - Web Admin Interface"
      - "com.mddb.version=${MDDB_VERSION:-2.10.0}"

  # MCP is built into the mddb server — runs on port 9000 by default
  # For stdio mode, use: docker run -i --rm -e MDDB_MCP_STDIO=true tradik/mddb:latest

  mddb-chat:
    build:
      context: .
      dockerfile: services/mddb-chat/Dockerfile
    container_name: mddb-chat
    restart: unless-stopped
    ports:
      - "11030:11030"
    environment:
      - MDDB_CHAT_CONFIG=/etc/mddb-chat/config.toml
      - MDDB_CHAT_LLM_API_KEY=${MDDB_CHAT_LLM_API_KEY}
    networks:
      - mddb-network
    logging: *default-logging
    deploy: *deploy-medium
    depends_on:
      mddb:
        condition: service_healthy
    labels:
      - "com.mddb.description=MDDB Chat - AI Chat Support"
      - "com.mddb.version=${MDDB_VERSION:-2.10.0}"

  mddb-chat-widget:
    build:
      context: .
      dockerfile: services/mddb-chat-widget/Dockerfile
    container_name: mddb-chat-widget
    restart: unless-stopped
    ports:
      - "11032:8080" # nginx-unprivileged listens on 8080 (OPS-006)
    networks:
      - mddb-network
    logging: *default-logging
    deploy: *deploy-small
    labels:
      - "com.mddb.description=MDDB Chat Widget - Embeddable JS chatbox"
      - "com.mddb.version=${MDDB_VERSION:-2.10.0}"

volumes:
  mddb-data:
    driver: local
    name: mddb-data

networks:
  mddb-network:
    driver: bridge
    name: mddb-network
