                    example: permission set
        "400":
          description: Invalid request (missing fields or group not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /graphql:
    post:
      tags:
        - GraphQL
      summary: GraphQL API endpoint
      description: |
        Execute GraphQL queries and mutations against the MDDB API.
        Requires `MDDB_GRAPHQL_ENABLED=true` environment variable.

        Supports queries for documents, search, vector search, full-text search, and hybrid search.
        Supports mutations for adding, deleting, and managing documents.
      operationId: graphqlQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: GraphQL query or mutation string
                  example: '{ stats { totalDocuments } }'
                variables:
                  type: object
                  additionalProperties: true
                  description: GraphQL variables
                operationName:
                  type: string
                  description: Name of the operation to execute (if query contains multiple)
      responses:
        "200":
          description: GraphQL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Query result data
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                        path:
                          type: array
                          items:
                            type: string
                    description: GraphQL errors (if any)

  /playground:
    get:
      tags:
        - GraphQL
      summary: GraphQL Playground
      description: |
        Interactive GraphQL Playground UI for exploring and testing the MDDB GraphQL API.
        Requires `MDDB_GRAPHQL_ENABLED=true` environment variable.
      operationId: graphqlPlayground
      responses:
        "200":
          description: GraphQL Playground HTML page
          content:
            text/html:
              schema:
                type: string

  /v1/automation:
    get:
      tags: [Automation]
      summary: List automation rules
      description: Returns all automation rules (webhooks, triggers, crons). Optionally filter by type.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [webhook, trigger, cron]
          description: Filter by rule type
      responses:
        "200":
          description: List of automation rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutomationRule'
                  total:
                    type: integer
    post:
      tags: [Automation]
      summary: Create automation rule
      description: Create a new webhook target, trigger, or cron rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationRule'
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRule'
        "400":
          description: Validation error

  /v1/automation/{id}:
    get:
      tags: [Automation]
      summary: Get automation rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Automation rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRule'
        "404":
          description: Not found
    put:
      tags: [Automation]
      summary: Update automation rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationRule'
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRule'
    delete:
      tags: [Automation]
      summary: Delete automation rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rule deleted

  /v1/automation/{id}/test:
    post:
      tags: [Automation]
      summary: Test trigger (dry run)
      description: Execute a trigger's search and return matching documents without firing the webhook.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test results
          content:
            application/json:
              schema:
                type: object
                properties:
                  trigger:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      searchType:
                        type: string
                      query:
                        type: string
                      threshold:
                        type: number
                  matches:
                    type: array
                    items:
                      $ref: '#/components/schemas/TriggerMatch'
                  total:
                    type: integer

components:
  schemas:
    Document:
      type: object
      properties:
        id:
          type: string
          description: Auto-generated document ID
          example: doc|blog|hello-world|en_US
        key:
          type: string
          description: Document key (unique within collection and language)
          example: hello-world
        lang:
          type: string
          description: Language code (e.g., en_US, pl_PL, de_DE)
          example: en_US
        meta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata key-value pairs (values are arrays)
          example:
            category: [blog, tutorial]
            author: [John Doe]
            tags: [markdown, database]
        contentMd:
          type: string
          description: Markdown content
          example: "# Hello World\n\nWelcome to MDDB!"
        addedAt:
          type: integer
          format: int64
          description: Unix timestamp when document was created
          example: 1704844800
        updatedAt:
          type: integer
          format: int64
          description: Unix timestamp when document was last updated
          example: 1704931200

    AddRequest:
      type: object
      required:
        - collection
        - key
        - lang
        - contentMd
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        key:
          type: string
          description: Document key
          example: hello-world
        lang:
          type: string
          description: Language code
          example: en_US
        meta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata key-value pairs
          example:
            category: [blog]
            author: [John Doe]
        contentMd:
          type: string
          description: Markdown content
          example: "# Hello World\n\nWelcome to MDDB!"

    GetRequest:
      type: object
      required:
        - collection
        - key
        - lang
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        key:
          type: string
          description: Document key
          example: hello-world
        lang:
          type: string
          description: Language code
          example: en_US
        env:
          type: object
          additionalProperties:
            type: string
          description: Template variables for substitution
          example:
            siteName: My Blog
            year: "2025"

    SearchRequest:
      type: object
      required:
        - collection
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        filterMeta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata filters (AND between keys, OR between values)
          example:
            category: [blog, tutorial]
            status: [published]
        sort:
          type: string
          enum: [addedAt, updatedAt, key]
          description: Sort field
          example: updatedAt
        asc:
          type: boolean
          description: Sort ascending (default false)
          example: false
        limit:
          type: integer
          description: Maximum number of results
          example: 10
        offset:
          type: integer
          description: Number of results to skip
          example: 0

    DeleteRequest:
      type: object
      required:
        - collection
        - key
        - lang
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        key:
          type: string
          description: Document key
          example: hello-world
        lang:
          type: string
          description: Language code
          example: en_US

    DeleteCollectionRequest:
      type: object
      required:
        - collection
      properties:
        collection:
          type: string
          description: Collection name to delete
          example: blog

    ExportRequest:
      type: object
      required:
        - collection
        - format
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        filterMeta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Optional metadata filters
          example:
            status: [published]
        format:
          type: string
          enum: [ndjson, zip]
          description: Export format
          example: ndjson

    TruncateRequest:
      type: object
      required:
        - collection
        - keepRevs
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        keepRevs:
          type: integer
          description: Number of revisions to keep per document (0 = delete all history)
          example: 3
        dropCache:
          type: boolean
          description: Clear document cache after truncation
          example: true

    Stats:
      type: object
      properties:
        databasePath:
          type: string
          example: /data/mddb.db
        databaseSize:
          type: integer
          format: int64
          description: Database file size in bytes
          example: 10485760
        mode:
          type: string
          enum: [read, write, wr]
          example: wr
        collections:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: blog
              documentCount:
                type: integer
                example: 42
              revisionCount:
                type: integer
                example: 156
              metaIndexCount:
                type: integer
                example: 84
        totalDocuments:
          type: integer
          example: 42
        totalRevisions:
          type: integer
          example: 156
        totalMetaIndices:
          type: integer
          example: 84
        uptime:
          type: string
          example: 2h15m30s

    VectorSearchRequest:
      type: object
      required:
        - collection
      properties:
        collection:
          type: string
          description: Collection name to search
          example: blog
        query:
          type: string
          description: Natural language query string (required if queryVector is not provided)
          example: How to set up a CI/CD pipeline?
        queryVector:
          type: array
          items:
            type: number
            format: float
          description: Raw embedding vector (optional, use instead of query for pre-computed embeddings)
        topK:
          type: integer
          description: Number of top results to return (default 5)
          default: 5
          example: 5
        threshold:
          type: number
          format: float
          description: Minimum cosine similarity score (0.0 to 1.0)
          minimum: 0
          maximum: 1
          example: 0.7
        filterMeta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata filters to narrow results before ranking
          example:
            category: [devops, tutorial]
        includeContent:
          type: boolean
          description: Whether to include document content in results (default false)
          default: false
          example: false
        algorithm:
          type: string
          enum: [flat, hnsw, ivf, pq]
          description: |
            Search algorithm to use (default "flat").
            - **flat**: Exact brute-force cosine similarity (most accurate, slower for large datasets)
            - **hnsw**: Hierarchical Navigable Small World graph (fast approximate, best general-purpose)
            - **ivf**: Inverted File Index with k-means clustering (good for large datasets)
            - **pq**: Product Quantization (compressed, lowest memory, slightly less accurate)
          default: flat
          example: flat

    VectorSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/VectorSearchResultItem"
        total:
          type: integer
          description: Number of results returned
          example: 5
        model:
          type: string
          description: Embedding model used
          example: text-embedding-3-small
        dimensions:
          type: integer
          description: Embedding vector dimensions
          example: 1536
        algorithm:
          type: string
          description: Algorithm used for this search
          example: flat

    VectorSearchResultItem:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/Document"
        score:
          type: number
          format: float
          description: Cosine similarity score (0.0 to 1.0)
          example: 0.92
        rank:
          type: integer
          description: Result rank (1-based)
          example: 1

    VectorReindexRequest:
      type: object
      required:
        - collection
      properties:
        collection:
          type: string
          description: Collection name to reindex
          example: blog
        force:
          type: boolean
          description: If true, re-embed even if content is unchanged
          default: false
          example: false

    VectorReindexResponse:
      type: object
      properties:
        embedded:
          type: integer
          description: Number of documents embedded
          example: 42
        skipped:
          type: integer
          description: Number of documents skipped (content unchanged)
          example: 10
        failed:
          type: integer
          description: Number of documents that failed to embed
          example: 0
        totalChunks:
          type: integer
          description: Total number of chunks embedded across all documents
          example: 128
        errors:
          type: array
          items:
            type: string
          description: Error messages for failed embeddings

    VectorStatsResponse:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether vector search is enabled
          example: true
        provider:
          type: string
          description: Embedding provider name
          example: text-embedding-3-small
        model:
          type: string
          description: Embedding model name
          example: text-embedding-3-small
        dimensions:
          type: integer
          description: Embedding vector dimensions
          example: 1536
        index_ready:
          type: boolean
          description: Whether the vector index is loaded and ready
          example: true
        collections:
          type: object
          additionalProperties:
            type: object
            properties:
              total_documents:
                type: integer
                description: Total documents in collection
                example: 100
              embedded_documents:
                type: integer
                description: Documents with embeddings
                example: 95
              total_chunks:
                type: integer
                description: Total embedding chunks (including multi-chunk documents)
                example: 280
          description: Per-collection embedding statistics
          example:
            blog:
              total_documents: 100
              embedded_documents: 95
              total_chunks: 280
        chunking:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether document chunking is enabled
              example: true
            chunkSize:
              type: integer
              description: Maximum characters per chunk
              example: 1500
          description: Chunking configuration

    FTSSearchRequest:
      type: object
      required:
        - collection
        - query
      properties:
        collection:
          type: string
          description: Collection name to search
          example: blog
        query:
          type: string
          description: Full-text search query string
          example: cancel subscription
        limit:
          type: integer
          description: Maximum number of results (default 50)
          default: 50
          example: 50
        algorithm:
          type: string
          enum: [tfidf, bm25, bm25f]
          description: |
            Scoring algorithm to use (default "tfidf").
            - **tfidf**: Classic TF-IDF scoring
            - **bm25**: Okapi BM25 with document length normalization (k1=1.2, b=0.75)
            - **bm25f**: BM25F field-weighted scoring — applies different weights to title, metadata, and content
          default: tfidf
          example: bm25
        fuzzy:
          type: integer
          enum: [0, 1, 2]
          description: |
            Typo tolerance level (default 0).
            - **0**: Off — exact term matching only
            - **1**: Low — matches terms within 1 edit distance (e.g. "javascrip" → "javascript")
            - **2**: Medium — matches terms within 2 edit distances
          default: 0
          example: 0
        filterMeta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata filters to narrow results before scoring (AND between keys, OR between values)
          example:
            category: [tutorial]
        fieldWeights:
          type: object
          additionalProperties:
            type: number
          description: Field weights for BM25F algorithm (keys are "title", "meta", "content")
          example:
            title: 3.0
            meta: 2.0
            content: 1.0
        disableStem:
          type: boolean
          description: Disable stemming for this query
          default: false
        disableSynonyms:
          type: boolean
          description: Disable synonym expansion for this query
          default: false

    FTSSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/FTSResultItem"
        total:
          type: integer
          description: Number of results returned
          example: 3
        algorithm:
          type: string
          description: Algorithm used for this search
          example: tfidf
        fuzzy:
          type: integer
          description: Typo tolerance level used
          example: 0

    FTSResultItem:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/Document"
        score:
          type: number
          format: float
          description: TF-IDF relevance score
          example: 2.45
        matchedTerms:
          type: array
          items:
            type: string
          description: Terms from the query that matched
          example: [cancel, subscription]

    ImportURLRequest:
      type: object
      required:
        - collection
        - url
        - lang
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        url:
          type: string
          format: uri
          description: URL to fetch content from
          example: https://example.com/post.md
        key:
          type: string
          description: Document key (derived from URL if empty)
          example: my-post
        lang:
          type: string
          description: Language code
          example: en_US
        meta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Additional metadata to merge with frontmatter
          example:
            source: [imported]
        ttl:
          type: integer
          description: Time-to-live in seconds (0 = no expiration)
          example: 3600

    SetTTLRequest:
      type: object
      required:
        - collection
        - key
        - lang
        - ttl
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        key:
          type: string
          description: Document key
          example: hello-world
        lang:
          type: string
          description: Language code
          example: en_US
        ttl:
          type: integer
          description: Time-to-live in seconds (0 = remove TTL)
          example: 3600

    Webhook:
      type: object
      properties:
        id:
          type: string
          description: Unique webhook ID
          example: abc123
        url:
          type: string
          format: uri
          description: Webhook callback URL
          example: https://example.com/hook
        events:
          type: array
          items:
            type: string
            enum: [doc.added, doc.updated, doc.deleted]
          description: Event types to listen for
          example: [doc.added, doc.updated]
        collection:
          type: string
          description: Collection filter (empty = all collections)
          example: blog
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp when the webhook was created
          example: 1704844800

    RegisterWebhookRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: Webhook callback URL
          example: https://example.com/hook
        events:
          type: array
          items:
            type: string
            enum: [doc.added, doc.updated, doc.deleted]
          description: Event types to listen for
          example: [doc.added, doc.updated]
        collection:
          type: string
          description: Collection filter (empty = all collections)
          example: blog

    DeleteWebhookRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Webhook ID to delete
          example: abc123

    SetSchemaRequest:
      type: object
      required:
        - collection
        - schema
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        schema:
          type: string
          description: JSON Schema string for metadata validation
          example: '{"type":"object","required":["author"],"properties":{"author":{"type":"array","items":{"type":"string"}}}}'

    SchemaResponse:
      type: object
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        schema:
          type: string
          description: JSON Schema string
          example: '{"type":"object","required":["author"]}'
        enabled:
          type: boolean
          description: Whether schema validation is enabled for this collection
          example: true

    ValidateRequest:
      type: object
      required:
        - collection
        - meta
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        meta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata to validate against the collection schema
          example:
            category: [blog]
            author: [John Doe]

    ValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the metadata is valid according to the schema
          example: true
        errors:
          type: array
          items:
            type: string
          description: Validation error messages (empty if valid)
          example: []

    ReplicationStatusResponse:
      type: object
      properties:
        node_id:
          type: string
          description: Unique node identifier
          example: leader-1
        role:
          type: string
          enum: [standalone, leader, follower]
          description: Replication role of this node
          example: leader
        current_lsn:
          type: integer
          format: uint64
          description: Current Log Sequence Number
          example: 45230
        binlog_oldest_lsn:
          type: integer
          format: uint64
          description: Oldest LSN still in the binlog (leader only)
          example: 40000
        binlog_size_bytes:
          type: integer
          format: int64
          description: Binlog file size in bytes (leader only)
          example: 15728640
        leader_addr:
          type: string
          description: Address of the leader node (follower only)
          example: leader:11024
        replication_lag_ms:
          type: integer
          format: int64
          description: Replication lag in milliseconds (follower only)
          example: 12
        healthy:
          type: boolean
          description: Whether this node is healthy
          example: true
        followers:
          type: array
          items:
            $ref: "#/components/schemas/FollowerInfo"
          description: Connected followers (leader only)
        uptime_seconds:
          type: integer
          format: int64
          description: Node uptime in seconds
          example: 86400

    FollowerInfo:
      type: object
      properties:
        follower_id:
          type: string
          description: Follower node identifier
          example: follower-1
        address:
          type: string
          description: Follower network address
          example: "10.0.0.2:11034"
        confirmed_lsn:
          type: integer
          format: uint64
          description: Last LSN confirmed by this follower
          example: 45228
        lag_ms:
          type: integer
          format: int64
          description: Estimated replication lag in milliseconds
          example: 12
        last_seen_at:
          type: integer
          format: int64
          description: Unix timestamp of last communication
          example: 1709500000
        status:
          type: string
          enum: [healthy, warning, unhealthy]
          description: "Follower health status (healthy: <1s lag, warning: 1-30s, unhealthy: >30s)"
          example: healthy

    HybridSearchRequest:
      type: object
      required:
        - collection
        - query
      properties:
        collection:
          type: string
          description: Collection name to search
          example: blog
        query:
          type: string
          description: Search query string (used for both FTS and embedding)
          example: how to deploy with Docker
        topK:
          type: integer
          description: Number of top results to return (default 10)
          default: 10
          example: 10
        algorithm:
          type: string
          enum: [bm25, bm25f]
          description: FTS algorithm (default "bm25")
          default: bm25
          example: bm25
        vectorAlgorithm:
          type: string
          enum: [flat, hnsw, ivf, pq, sq]
          description: Vector search algorithm (default "flat")
          default: flat
          example: flat
        strategy:
          type: string
          enum: [alpha, rrf]
          description: |
            Fusion strategy (default "alpha").
            - **alpha**: Weighted blending — `combined = (1-alpha) * normalizedFTS + alpha * vectorScore`
            - **rrf**: Reciprocal Rank Fusion — `score = 1/(k + rank_fts) + 1/(k + rank_vector)`
          default: alpha
          example: alpha
        alpha:
          type: number
          format: float
          description: Alpha blending weight (0=keyword only, 1=semantic only, default 0.5). Only used with "alpha" strategy.
          minimum: 0
          maximum: 1
          default: 0.5
          example: 0.5
        rrfK:
          type: integer
          description: RRF parameter k (default 60). Only used with "rrf" strategy.
          default: 60
          example: 60
        fuzzy:
          type: integer
          enum: [0, 1, 2]
          description: Typo tolerance for FTS (0=off, 1=1 edit, 2=2 edits)
          default: 0
          example: 0
        threshold:
          type: number
          format: float
          description: Minimum vector similarity score (0.0 to 1.0)
          minimum: 0
          maximum: 1
          example: 0.0
        filterMeta:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Metadata filters applied to both FTS and vector results
          example:
            category: [tutorial]
        includeContent:
          type: boolean
          description: Include document content in results
          default: false
        fieldWeights:
          type: object
          additionalProperties:
            type: number
          description: Field weights for BM25F (keys are "title", "meta", "content")
          example:
            title: 3.0
            meta: 2.0
            content: 1.0
        disableStem:
          type: boolean
          description: Disable stemming for FTS
          default: false
        disableSynonyms:
          type: boolean
          description: Disable synonym expansion for FTS
          default: false

    HybridSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/HybridSearchResultItem"
        total:
          type: integer
          description: Number of results returned
          example: 5
        strategy:
          type: string
          description: Fusion strategy used
          example: alpha
        alpha:
          type: number
          description: Alpha value used (only for alpha strategy)
          example: 0.5
        rrfK:
          type: integer
          description: RRF k value used (only for rrf strategy)
          example: 60
        ftsAlgorithm:
          type: string
          description: FTS algorithm used
          example: bm25
        vectorAlgorithm:
          type: string
          description: Vector algorithm used
          example: flat

    HybridSearchResultItem:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/Document"
        combinedScore:
          type: number
          format: float
          description: Fused score from both FTS and vector
          example: 0.78
        ftsScore:
          type: number
          format: float
          description: Normalized FTS score component
          example: 0.65
        vectorScore:
          type: number
          format: float
          description: Vector similarity score component
          example: 0.91
        matchedTerms:
          type: array
          items:
            type: string
          description: FTS matched terms
          example: [deploy, docker]
        rank:
          type: integer
          description: Result rank (1-based)
          example: 1

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: document not found

    SynonymRequest:
      type: object
      required:
        - collection
        - term
        - synonyms
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        term:
          type: string
          description: Base term for the synonym group
          example: big
        synonyms:
          type: array
          items:
            type: string
          description: List of synonyms for the term
          example: [large, huge, enormous]

    SynonymDeleteRequest:
      type: object
      required:
        - collection
        - term
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        term:
          type: string
          description: Term whose synonyms to delete
          example: big

    SynonymEntry:
      type: object
      properties:
        term:
          type: string
          description: Base term
          example: big
        synonyms:
          type: array
          items:
            type: string
          description: List of synonyms
          example: [large, huge, enormous]

    SynonymListResponse:
      type: object
      properties:
        collection:
          type: string
          description: Collection name
          example: blog
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SynonymEntry"
        total:
          type: integer
          description: Total number of synonym entries
          example: 10

    EmbeddingConfig:
      type: object
      required:
        - id
        - name
        - provider
        - model
        - dimensions
      properties:
        id:
          type: string
          description: Unique identifier
          example: openai-small
        name:
          type: string
          description: Display name
          example: OpenAI Small
        provider:
          type: string
          enum: [openai, ollama, cohere, voyage]
          description: Embedding provider
          example: openai
        model:
          type: string
          description: Model name
          example: text-embedding-3-small
        dimensions:
          type: integer
          description: Embedding vector dimensions
          example: 1536
        apiKey:
          type: string
          description: API key (for OpenAI, Cohere, Voyage)
          example: sk-...
        apiUrl:
          type: string
          description: API URL (for Ollama or custom endpoints)
          example: http://localhost:11434
        isDefault:
          type: boolean
          description: Whether this is the default configuration
          example: false
        createdAt:
          type: integer
          format: int64
          description: Creation timestamp (Unix seconds)
          example: 1704844800

    SystemInfoResponse:
      type: object
      properties:
        hostname:
          type: string
          description: Server hostname
          example: mddb-server
        os:
          type: string
          description: Operating system
          example: linux
        arch:
          type: string
          description: CPU architecture
          example: amd64
        numCPU:
          type: integer
          description: Number of logical CPUs
          example: 8
        goVersion:
          type: string
          description: Go runtime version
          example: go1.22.0
        version:
          type: string
          description: MDDB server version
          example: 2.6.6
        uptimeSeconds:
          type: integer
          format: int64
          description: Server uptime in seconds
          example: 86400
        memoryTotal:
          type: integer
          format: uint64
          description: Total allocated memory in bytes (cumulative)
          example: 104857600
        memoryUsed:
          type: integer
          format: uint64
          description: Currently allocated memory in bytes
          example: 52428800
        memorySystem:
          type: integer
          format: uint64
          description: System memory obtained from OS in bytes
          example: 73400320
        memoryHeap:
          type: integer
          format: uint64
          description: Heap memory in use in bytes
          example: 41943040
        numGoroutines:
          type: integer
          description: Number of active goroutines
          example: 42
        cpuUsagePercent:
          type: number
          format: float
          description: CPU usage percentage (0-100)
          example: 12.5
        network:
          type: array
          items:
            $ref: "#/components/schemas/NetworkInterface"

    NetworkInterface:
      type: object
      properties:
        name:
          type: string
          description: Interface name
          example: eth0
        addresses:
          type: array
          items:
            type: string
          description: IP addresses assigned to this interface
          example: ["192.168.1.10/24", "fe80::1/64"]
        flags:
          type: string
          description: Interface flags
          example: up|broadcast|multicast

    ConfigResponse:
      type: object
      properties:
        version:
          type: string
          description: MDDB server version
          example: 2.6.6
        databasePath:
          type: string
          description: Path to the database file
          example: /data/mddb.db
        mode:
          type: string
          description: Server mode
          example: wr
        panelMode:
          type: string
          description: Panel mode (internal or external)
          example: internal
        protocols:
          type: object
          properties:
            http:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
                addr:
                  type: string
                  example: ":11023"
            grpc:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
                addr:
                  type: string
                  example: ":11024"
            mcp:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: false
                addr:
                  type: string
                  example: ""
                stdio:
                  type: boolean
                  example: false
            http3:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: false
                addr:
                  type: string
                  example: ""
        authEnabled:
          type: boolean
          description: Whether authentication is enabled
          example: false
        metricsEnabled:
          type: boolean
          description: Whether Prometheus metrics are enabled
          example: true
        replicationRole:
          type: string
          description: Replication role of this node
          example: standalone
        vectorConfig:
          type: object
          description: Vector search configuration (if enabled)
          properties:
            enabled:
              type: boolean
              example: true
            provider:
              type: string
              example: openai
            model:
              type: string
              example: text-embedding-3-small
            dimensions:
              type: integer
              example: 1536
            apiUrl:
              type: string
              example: https://api.openai.com/v1
        chunkConfig:
          type: object
          description: Document chunking configuration
          properties:
            enabled:
              type: boolean
              example: true
            chunkSize:
              type: integer
              example: 1500

    EndpointsResponse:
      type: object
      properties:
        http:
          type: array
          items:
            type: object
            properties:
              method:
                type: string
                description: HTTP method(s)
                example: POST
              path:
                type: string
                description: URL path
                example: /v1/add
              description:
                type: string
                description: Endpoint description
                example: Add/update document
              requiresAuth:
                type: boolean
                description: Whether authentication is required
                example: true
        grpc:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: gRPC method name
                example: Add
              description:
                type: string
                description: Method description
                example: Add/update document
        mcp:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: MCP tool name
                example: add_document
              description:
                type: string
                description: Tool description
                example: Add/update document
              inputSchema:
                type: object
                description: JSON Schema for the tool input

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username
          example: admin
        password:
          type: string
          description: Password
          example: secret

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresAt:
          type: integer
          format: int64
          description: Token expiration timestamp (Unix seconds)
          example: 1704931200

    RegisterRequest:
      type: object
      required:
        - username
