              description:
                type: string
                description: API key description
                example: CI/CD pipeline key
              createdAt:
                type: integer
                format: int64
                description: Creation timestamp (Unix seconds)
                example: 1704844800
              expiresAt:
                type: integer
                format: int64
                description: Expiration timestamp (Unix seconds, 0 = never)
                example: 0

    GetMeResponse:
      type: object
      properties:
        username:
          type: string
          description: Current user's username
          example: admin
        admin:
          type: boolean
          description: Whether the user has admin privileges
          example: true
        createdAt:
          type: integer
          format: int64
          description: Account creation timestamp (Unix seconds)
          example: 1704844800

    Permission:
      type: object
      properties:
        username:
          type: string
          description: Username
          example: alice
        collection:
          type: string
          description: Collection name ("*" for all collections)
          example: blog
        read:
          type: boolean
          description: Read permission
          example: true
        write:
          type: boolean
          description: Write permission
          example: true
        admin:
          type: boolean
          description: Admin permission
          example: false

    SetPermissionRequest:
      type: object
      required:
        - username
        - collection
      properties:
        username:
          type: string
          description: Username
          example: alice
        collection:
          type: string
          description: Collection name ("*" for all collections)
          example: blog
        read:
          type: boolean
          description: Read permission
          example: true
        write:
          type: boolean
          description: Write permission
          example: true
        admin:
          type: boolean
          description: Admin permission
          example: false

    SetPermissionResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    UsersListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              username:
                type: string
                description: Username
                example: alice
              createdAt:
                type: integer
                format: int64
                description: Account creation timestamp (Unix seconds)
                example: 1704844800
              disabled:
                type: boolean
                description: Whether the user is disabled
                example: false
              admin:
                type: boolean
                description: Whether the user has admin privileges
                example: false
              groups:
                type: array
                items:
                  type: string
                description: Groups the user belongs to
                example: [developers, editors]

    Group:
      type: object
      properties:
        name:
          type: string
          description: Group name
          example: developers
        description:
          type: string
          description: Group description
          example: Development team
        members:
          type: array
          items:
            type: string
          description: List of usernames in the group
          example: [alice, bob]
        createdAt:
          type: integer
          format: int64
          description: Creation timestamp (Unix seconds)
          example: 1704844800

    CreateGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Group name
          example: developers
        description:
          type: string
          description: Group description
          example: Development team
        members:
          type: array
          items:
            type: string
          description: Initial list of member usernames
          example: [alice, bob]

    UpdateGroupRequest:
      type: object
      properties:
        description:
          type: string
          description: Updated group description
          example: Development team (updated)
        members:
          type: array
          items:
            type: string
          description: Updated list of member usernames
          example: [alice, bob, charlie]

    GroupsListResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"

    GroupPermission:
      type: object
      required:
        - groupName
        - collection
      properties:
        groupName:
          type: string
          description: Group name
          example: developers
        collection:
          type: string
          description: Collection name ("*" for all collections)
          example: blog
        read:
          type: boolean
          description: Read permission
          example: true
        write:
          type: boolean
          description: Write permission
          example: true
        admin:
          type: boolean
          description: Admin permission
          example: false

    AutomationRule:
      type: object
      required: [type, name]
      properties:
        id:
          type: string
          readOnly: true
        type:
          type: string
          enum: [webhook, trigger, cron]
        name:
          type: string
        enabled:
          type: boolean
          default: true
        createdAt:
          type: integer
          readOnly: true
        updatedAt:
          type: integer
          readOnly: true
        url:
          type: string
          description: Webhook URL (type=webhook)
        method:
          type: string
          enum: [POST, GET, PUT]
          default: POST
          description: HTTP method (type=webhook)
        headers:
          type: object
          additionalProperties:
            type: string
          description: Custom HTTP headers (type=webhook)
        collection:
          type: string
          description: Target collection (type=trigger)
        searchType:
          type: string
          enum: [fts, vector, hybrid]
          description: Search type (type=trigger)
        query:
          type: string
          description: Search query (type=trigger)
        threshold:
          type: number
          minimum: 0
          maximum: 100
          description: Minimum score threshold 0-100 (type=trigger)
        webhookId:
          type: string
          description: Target webhook ID (type=trigger)
        searchParams:
          type: object
          description: Extra search parameters (type=trigger)
        schedule:
          type: string
          description: Cron expression e.g. "0 9 * * *" (type=cron)
        triggerId:
          type: string
          description: Target trigger ID (type=cron)
        lastRun:
          type: integer
          readOnly: true
          description: Last execution timestamp (type=cron)
        nextRun:
          type: integer
          readOnly: true
          description: Next scheduled execution (type=cron)

    TriggerMatch:
      type: object
      properties:
        docId:
          type: string
        collection:
          type: string
        score:
          type: number

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from POST /v1/auth/login
    APIKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key obtained from POST /v1/auth/api-key
