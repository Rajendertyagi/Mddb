version: '3.8'

services:
  # MDDB Server (Backend)
  mddbd:
    build:
      context: ./services/mddbd
      dockerfile: Dockerfile.dev
    container_name: mddb-server
    ports:
      - "11023:11023"  # HTTP API
      - "11024:11024"  # gRPC
    volumes:
      - ./services/mddbd:/app
      - mddb-data:/data
    environment:
      - MDDB_PATH=/data/mddb.db
      - MDDB_MODE=wr
      - MDDB_ADDR=:11023
      - MDDB_GRPC_ADDR=:11024
      - MDDB_AUTH_ENABLED=true
      - MDDB_AUTH_JWT_SECRET=dev-secret-change-in-production-12345678901234567890
      - MDDB_AUTH_JWT_EXPIRY=24h
      - MDDB_AUTH_ADMIN_USERNAME=admin
      - MDDB_AUTH_ADMIN_PASSWORD=admin123
      - MDDB_METRICS=true
      - MDDB_EMBEDDING_PROVIDER=ollama
      - MDDB_EMBEDDING_API_URL=http://ollama:11434
      - MDDB_EMBEDDING_MODEL=nomic-embed-text
      - MDDB_EMBEDDING_DIMENSIONS=768
    networks:
      - mddb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11023/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MDDB Panel (Frontend)
  mddb-panel:
    build:
      context: ./services/mddb-panel
      dockerfile: Dockerfile
      target: development
    container_name: mddb-panel
    ports:
      - "3000:3000"
    volumes:
      - ./services/mddb-panel:/app
      - /app/node_modules
    environment:
      - VITE_MDBB_SERVER=localhost:11023
      - NODE_ENV=development
    networks:
      - mddb-network
    depends_on:
      - mddbd
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

  # MDDB MCP Server
  mddb-mcp:
    build:
      context: ./services/mddb-mcp
      dockerfile: Dockerfile
    container_name: mddb-mcp
    ports:
      - "9000:9000"
    volumes:
      - ./services/mddb-mcp:/app
      - ./services/mddb-mcp/config.yaml:/app/config.yaml:ro
    environment:
      - MCP_LISTEN_ADDRESS=0.0.0.0:9000
      - MDDB_GRPC_ADDRESS=mddbd:11024
      - MDDB_REST_BASE_URL=http://mddbd:11023
    networks:
      - mddb-network
    depends_on:
      - mddbd
    restart: unless-stopped

  # Ollama (Optional - for vector embeddings)
  ollama:
    image: ollama/ollama:latest
    container_name: mddb-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - mddb-network
    restart: unless-stopped
    profiles:
      - with-ollama

volumes:
  mddb-data:
    driver: local
  ollama-data:
    driver: local

networks:
  mddb-network:
    driver: bridge
