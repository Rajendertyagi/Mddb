services:
  # MDDB Server (Backend)
  mddbd:
    build:
      context: .
      dockerfile: services/mddbd/Dockerfile.dev
    container_name: mddb-server
    ports:
      - "11023:11023"  # HTTP API
      - "11024:11024"  # gRPC
      - "9000:9000"    # MCP
    volumes:
      - ./services/mddbd:/app
      - mddb-data:/data
    environment:
      - MDDB_PATH=/data/mddb.db
      - MDDB_MODE=wr
      - MDDB_ADDR=:11023
      - MDDB_GRPC_ADDR=:11024
      - MDDB_AUTH_ENABLED=true
      - MDDB_AUTH_JWT_SECRET=dev-secret-change-in-production-12345678901234567890
      - MDDB_AUTH_JWT_EXPIRY=24h
      - MDDB_AUTH_ADMIN_USERNAME=admin
      - MDDB_AUTH_ADMIN_PASSWORD=admin123
      - MDDB_METRICS=true
      - MDDB_MCP_ENABLED=true
      - MDDB_GRPC_ENABLED=true
      - MDDB_EMBEDDING_PROVIDER=ollama
      - MDDB_EMBEDDING_API_URL=http://host.docker.internal:11434
      - MDDB_EMBEDDING_MODEL=nomic-embed-text
      - MDDB_EMBEDDING_DIMENSIONS=768
      # - MDDB_PANEL_MODE=external  # internal (default, CORS enabled) or external (CORS disabled, panel proxies)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mddb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11023/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MDDB Panel (Frontend)
  mddb-panel:
    build:
      context: .
      dockerfile: services/mddb-panel/Dockerfile
      target: development
    container_name: mddb-panel
    ports:
      - "3000:3000"
    volumes:
      - ./services/mddb-panel:/app
      - /app/node_modules
      - ./scripts:/app/scripts
    environment:
      - MDDB_SERVER=http://mddbd:11023
      - NODE_ENV=development
    networks:
      - mddb-network
    depends_on:
      - mddbd
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

  # MCP is built into mddbd — runs on port 9000 by default

  # MDDB Chat (Rust server)
  mddb-chat:
    build:
      context: .
      dockerfile: services/mddb-chat/Dockerfile.dev
    container_name: mddb-chat
    ports:
      - "11030:11030"
    volumes:
      - ./services/mddb-chat:/app
      - ./proto:/proto
    environment:
      - MDDB_CHAT_CONFIG=/app/config.toml
      - MDDB_CHAT_LLM_API_KEY=${MDDB_CHAT_LLM_API_KEY}
      - RUST_LOG=mddb_chat=debug,tower_http=debug
    networks:
      - mddb-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mddbd:
        condition: service_healthy
    restart: unless-stopped

  # MDDB Chat Widget (static JS)
  mddb-chat-widget:
    build:
      context: .
      dockerfile: services/mddb-chat-widget/Dockerfile
    container_name: mddb-chat-widget
    ports:
      - "11032:80"
    networks:
      - mddb-network
    restart: unless-stopped

  # Ollama (Optional - use profile "with-ollama" if no local Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: mddb-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - mddb-network
    restart: unless-stopped
    profiles:
      - with-ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mddb-data:
    driver: local
  ollama-data:
    driver: local

networks:
  mddb-network:
    driver: bridge
