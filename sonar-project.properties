sonar.projectKey=tradik_mddb
sonar.organization=tradik

# Project uses camelCase across the codebase (see CLAUDE.md).
# Silence Python PEP 8 snake_case rules only for the Python integrations —
# the rest of the repo is Go where camelCase is idiomatic and unaffected.
# Rules muted:
#   python:S100   — Method names should comply with a naming convention
#   python:S116   — Field names should comply with a naming convention
#   python:S117   — Local variable and function parameter names should comply with a naming convention
#   python:S1542  — Function names should comply with a naming convention
sonar.issue.ignore.multicriteria=py-naming-s100,py-naming-s116,py-naming-s117,py-naming-s1542

sonar.issue.ignore.multicriteria.py-naming-s100.ruleKey=python:S100
sonar.issue.ignore.multicriteria.py-naming-s100.resourceKey=integrations/airbyte-destination/**/*.py

sonar.issue.ignore.multicriteria.py-naming-s116.ruleKey=python:S116
sonar.issue.ignore.multicriteria.py-naming-s116.resourceKey=integrations/airbyte-destination/**/*.py

sonar.issue.ignore.multicriteria.py-naming-s117.ruleKey=python:S117
sonar.issue.ignore.multicriteria.py-naming-s117.resourceKey=integrations/airbyte-destination/**/*.py

sonar.issue.ignore.multicriteria.py-naming-s1542.ruleKey=python:S1542
sonar.issue.ignore.multicriteria.py-naming-s1542.resourceKey=integrations/airbyte-destination/**/*.py
